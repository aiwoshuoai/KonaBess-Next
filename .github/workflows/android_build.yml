name: 构建与预发布

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'release'
          - 'debug'

jobs:
  build:
    name: 构建任务
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 生成版本号
        id: version
        run: |
          VERSION_NAME=$(date +'%Y.%m.%d.%H.%M.%S')
          VERSION_CODE=$(date +'%s')
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 生成更新日志
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 解密密钥
        # 只有选择 release 或 all，且存在密钥时才解密
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event_name == 'push')
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > ${{ github.workspace }}/keystore.jks
          fi

      - name: 编译 [正式版] Release
        # 条件：手动选了 release/all，或者是 push 触发
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event_name == 'push')
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            ./gradlew assembleRelease \
              -PciVersionName="${{ steps.version.outputs.version }}" \
              -PciVersionCode="${{ steps.version.outputs.code }}" \
              -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            ./gradlew assembleRelease -PciVersionName="${{ steps.version.outputs.version }}" -PciVersionCode="${{ steps.version.outputs.code }}"
          fi

      - name: 编译 [测试版] Debug
        # 条件：手动选了 debug/all，或者是 push 触发
        if: (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name == 'push')
        run: ./gradlew assembleDebug -PciVersionName="${{ steps.version.outputs.version }}" -PciVersionCode="${{ steps.version.outputs.code }}"

      - name: 规范化 APK 文件名
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          find app/build/outputs/apk/ -name "*.apk" -type f | while read file; do
            type="unknown"
            if [[ "$file" == *"debug"* ]]; then type="debug"; fi
            if [[ "$file" == *"release"* ]]; then type="release"; fi
            new_name="KonaBessNext-v${VERSION}-${type}.apk"
            mv "$file" "$(dirname "$file")/$new_name"
          done

      - name: 发布至 GitHub Release
        # 只有 push 或者手动运行且包含 release 时才发布 Release 页面
        if: github.event_name == 'push' || (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "KonaBessNext 汉化版 ${{ steps.version.outputs.version }}"
          body: |
            ### 自动构建成功
            - 构建类型: ${{ github.event.inputs.build_type || 'Push 自动触发' }}
            - 版本名称: ${{ steps.version.outputs.version }}
            
            **更新日志:**
            ${{ steps.changelog.outputs.changelog }}
          prerelease: true
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Artifacts (备份)
        uses: actions/upload-artifact@v4
        with:
          name: KonaBess-Build-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/**/*.apk

      - name: 清理
        if: always()
        run: rm -f ${{ github.workspace }}/keystore.jks